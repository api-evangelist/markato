aid: markato
name: Markato
description: >-
  Markato (legally On Your Marks) is a brand builder and distributor for health, beauty, and wellness
  brands across Asia, positioning itself as a next-generation distribution disruptor. From bases in Hong
  Kong, Singapore, Taiwan, Malaysia, Thailand, and Australia, it helps high-potential brands enter, grow,
  and dominate the region's most competitive markets. Its capabilities span strategic channel development
  into top-tier offline and online retailers (Sephora, Watsons, Mannings, SaSa), e-commerce and social
  commerce operations across Shopee, TikTok, and Lazada, 360-degree marketing and brand building, and
  end-to-end local operations, logistics, product registration, and compliance. Markato is backed by a
  roughly US$4M seed round led by Lightspeed Venture Partners, with a team drawn from L'Oreal, P&G,
  McKinsey, and Lane Crawford. Markato is a services and distribution business and does not currently
  publish a public API, developer portal, or SDKs.
